<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primestore</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

nav{
background:#1e293b;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
}

.cart{
background:red;
padding:5px 10px;
border-radius:20px;
}

.hero{
text-align:center;
padding:60px 20px;
background:#0f172a;
color:white;
}

.hero button{
padding:12px 25px;
background:#ff7b00;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:8px;
}

.price{
color:green;
font-size:20px;
font-weight:bold;
}

button{
background:#ff7b00;
border:none;
padding:10px 20px;
color:white;
border-radius:5px;
cursor:pointer;
}

footer{
background:#1e293b;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>
</head>

<body>

<nav>
<div class="logo">Primestore</div>
<div class="cart">Cart: <span id="count">0</span></div>
</nav>

<section class="hero">
<h1>Welcome to Primestore</h1>
<p>Best Deals At Best Prices</p>
<button>Shop Now</button>
</section>

<section class="products">

<div class="card">
<img src="https:<img src="YOUR_IMAGE_LINK">
<h3>Football Jersey</h3>
<p class="price">₹799</p>
<button onclick="addCart()">Add To Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?2">
<h3>Headphones</h3>
<p class="price">₹999</p>
<button onclick="addCart()">Add To Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?3">
<h3>Smart Watch</h3>
<p class="price">₹1499</p>
<button onclick="addCart()">Add To Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?4">
<h3>Mobile Cover</h3>
<p class="price">₹299</p>
<button onclick="addCart()">Add To Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?5">
<h3>Shoes</h3>
<p class="price">₹2499</p>
<button onclick="addCart()">Add To Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?6">
<h3>Backpack</h3>
<p class="price">₹899</p>
<button onclick="addCart()">Add To Cart</button>
</div>

</section>

<footer>
© 2026 Primestore. All Rights Reserved.
</footer>

<script>
let count = 0;

function addCart(){
count++;
document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
